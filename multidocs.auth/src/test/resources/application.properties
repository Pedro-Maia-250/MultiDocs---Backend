spring.application.name=multidocs.auth-test
server.port=0

springdoc.swagger-ui.path=/api-doc

token.secret=test-secret

spring.datasource.url=jdbc:h2:mem:multidocs_auth_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
